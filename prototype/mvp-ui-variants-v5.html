<!--
  PROTOTYPE v5 — throwaway. Answers wayfinder ticket #3.

  v4's bento direction was right but "clunky." Root causes fixed here:
    - boxy 1px borders on every card -> replaced with soft shadow elevation
    - shouty uppercase tracked labels -> calm sentence-case, like the reference
    - too many DIFFERENT chart types (ring + nested bubbles + sparkline +
      dot-grid, all competing) -> narrowed to one consistent visual
      language: rings + a single sparkline. Goals are now two small rings,
      not nested bubbles.
    - Health dashboard had a redundant extra card duplicating info ->
      trimmed to mindmap + today + one streak highlight.
    - inconsistent card headers -> every card gets the same icon-circle +
      label treatment.

  Read-only. Mock data only. Not for production.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PROTOTYPE v5 — refined bento dashboard</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    --bg: #F3EEE5;
    --bg2: #EAE2D3;
    --card: #FFFFFF;
    --ink: #211D19;
    --muted: #928B7E;
    --coral: #D9714B;
    --coral-soft: #F6E1D5;
    --health: #6E8B74;
    --health-soft: #E7EEE6;
    --black-card: #1E1B17;
    background: var(--bg);
    color: var(--ink);
  }
  button { font-family: inherit; cursor: pointer; }
  h1, h2, h3, p { margin: 0; }
  .shadow-sm { box-shadow: 0 1px 2px rgba(33,29,25,.04), 0 10px 28px rgba(33,29,25,.05); }

  #stage { min-height: 100vh; position: relative; }
  #stage.force-mobile { max-width: 430px; margin: 0 auto; }
  #app { position: relative; transition: opacity .18s ease; }
  #app.fading { opacity: 0; }

  .back-btn { width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--card); color: var(--ink); box-shadow: 0 2px 8px rgba(33,29,25,.08); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .crumb { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .dot { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; }
  .dot.full { background: var(--health); }
  .dot.min { background: var(--coral); opacity: .55; }
  .dot.none { background: var(--bg2); }

  /* ============ Welcome ============ */
  .welcome-screen { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; position: relative; overflow: hidden; }
  .welcome-screen::before { content: ""; position: absolute; inset: -20%; background: radial-gradient(circle at 25% 20%, rgba(110,139,116,.14), transparent 55%), radial-gradient(circle at 80% 75%, rgba(217,113,75,.12), transparent 55%); filter: blur(10px); }
  .welcome-eyebrow, .welcome-title, .welcome-sub, .continue-btn { position: relative; }
  .welcome-eyebrow { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
  .welcome-title { font-size: 33px; line-height: 1.22; margin-bottom: 14px; font-weight: 600; }
  .welcome-sub { font-size: 15px; line-height: 1.55; color: var(--muted); max-width: 340px; margin-bottom: 40px; }
  .continue-btn { padding: 15px 36px; border-radius: 999px; border: none; font-size: 15px; font-weight: 600; background: var(--ink); color: var(--bg); }

  /* ============ shell ============ */
  .app-shell { display: flex; min-height: 100vh; }
  .sidebar { width: 100%; flex-shrink: 0; padding: 24px 18px; display: none; }
  .sidebar .brand { font-size: 15px; font-weight: 700; padding: 4px 10px 24px; display: flex; align-items: center; gap: 8px; }
  .brand-mark { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .side-item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; border: none; background: none; width: 100%; text-align: left; margin-bottom: 4px; color: var(--muted); font-size: 14px; font-weight: 500; }
  .side-item .swatch { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .side-item.active { background: var(--card); color: var(--ink); font-weight: 700; }
  .side-item .meta { margin-left: auto; font-size: 11px; color: var(--muted); }
  .main { flex: 1; min-width: 0; }
  .content { padding: 6px 22px 40px; max-width: 980px; }

  .header { display: flex; align-items: center; gap: 12px; padding: 20px 22px 8px; }

  .topbar { display: flex; align-items: center; gap: 14px; padding: 22px 22px 6px; flex-wrap: wrap; }
  .topbar .titles h2 { font-size: 19px; font-weight: 700; }
  .search-pill { flex: 1; min-width: 130px; max-width: 300px; background: var(--card); border-radius: 999px; padding: 9px 16px; font-size: 13px; color: var(--muted); }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .greet-row { padding: 8px 22px 22px; }
  .greet-row .headline { font-size: 24px; font-weight: 600; letter-spacing: -.01em; }

  /* ============ bento grid ============ */
  .bento-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  .bento-card { background: var(--card); border-radius: 28px; padding: 26px; }
  .bento-card.dark { background: var(--black-card); color: #F4EFE7; }
  .card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .card-icon { width: 34px; height: 34px; border-radius: 50%; background: var(--bg2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .bento-card.dark .card-icon { background: rgba(244,239,231,.1); }
  .card-icon svg { width: 16px; height: 16px; }
  .card-title { font-size: 14px; font-weight: 500; color: var(--muted); }
  .bento-card.dark .card-title { color: rgba(244,239,231,.6); }
  .bento-big-num { font-size: 32px; font-weight: 700; letter-spacing: -.01em; }
  .bento-sub { font-size: 13px; color: var(--muted); margin-top: 5px; }
  .bento-card.dark .bento-sub { color: rgba(244,239,231,.5); }

  .pill-row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .pill-btn { border: none; border-radius: 999px; padding: 11px 20px; font-size: 13px; font-weight: 600; }
  .pill-btn.primary { background: var(--ink); color: var(--bg); }
  .pill-chip { border-radius: 999px; padding: 6px 13px; font-size: 12px; font-weight: 600; background: var(--bg2); color: var(--muted); border: none; }
  .pill-chip.active { background: var(--coral-soft); color: var(--coral); }

  /* rings — one consistent visual language, used for both hero + goals */
  .ring-center { position: relative; width: 112px; height: 112px; margin: 0 auto; }
  .ring-center.sm { width: 76px; height: 76px; }
  .ring-svg { display: block; transform: rotate(-90deg); }
  .ring-num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-num .pct { font-size: 24px; font-weight: 700; }
  .ring-num.sm .pct { font-size: 16px; }
  .ring-num .lbl { font-size: 10px; color: rgba(244,239,231,.55); margin-top: 2px; }
  .ring-num.sm .lbl { color: var(--muted); }

  .goal-rings { display: flex; gap: 28px; justify-content: space-around; margin-top: 4px; }
  .goal-ring-item { text-align: center; }
  .goal-ring-item .name { font-size: 13px; font-weight: 600; margin-top: 12px; }
  .goal-ring-item .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .spark-num { display: flex; align-items: baseline; gap: 10px; }
  .spark-badge { background: var(--health-soft); color: var(--health); font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }

  /* clean divided list, replaces the old boxed system-row */
  .list-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 0; border-top: 1px solid rgba(33,29,25,.06); }
  .list-row:first-of-type { border-top: none; padding-top: 4px; }
  .list-row .left { display: flex; align-items: center; gap: 12px; }
  .list-row .name { font-size: 14px; font-weight: 500; }
  .list-row .next { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--health); flex-shrink: 0; }

  .streak-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 16px; }
  .streak-cell { aspect-ratio: 1; border-radius: 7px; background: var(--bg2); }
  .streak-cell.hit { background: var(--health); }

  /* mindmap */
  .mindmap-wrap { position: relative; height: 260px; }
  .mm-node { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 11px; font-weight: 600; border: none; transform: translate(-50%, -50%); }
  .mm-node.core { width: 60px; height: 60px; left: 50%; top: 50%; font-size: 12px; z-index: 2; background: var(--ink); color: var(--bg); }
  .mm-node.leaf { width: 52px; height: 52px; z-index: 1; background: var(--bg2); color: var(--ink); }
  .mm-node.leaf.active { background: var(--health); color: white; }
  .mm-link { position: absolute; height: 1.5px; transform-origin: left center; z-index: 0; background: rgba(33,29,25,.08); }

  .pillar-tiles { display: flex; flex-direction: column; gap: 14px; margin-top: 6px; }
  .pillar-tile { border: none; text-align: left; padding: 26px; border-radius: 26px; display: flex; flex-direction: column; gap: 6px; width: 100%; background: var(--card); }
  .pillar-tile.health .name { color: var(--health); }
  .pillar-tile.finance .name { color: var(--coral); }
  .pillar-tile .name { font-size: 19px; font-weight: 700; }
  .pillar-tile .hint { font-size: 13px; color: var(--muted); }

  .area-list { display: flex; flex-direction: column; gap: 10px; }
  .action-row { display: flex; align-items: center; justify-content: space-between; padding: 17px 20px; border-radius: 20px; background: var(--card); }
  .action-row .name { font-size: 15px; font-weight: 600; }
  .action-row .streak { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .action-hero { padding: 32px 28px; border-radius: 28px; background: var(--health-soft); text-align: center; }
  .action-hero .name { font-size: 21px; font-weight: 700; margin-bottom: 8px; }
  .action-hero .desc { font-size: 14px; color: var(--muted); line-height: 1.55; margin-bottom: 24px; }
  .checkin-btn { width: 84px; height: 84px; border-radius: 50%; border: none; font-size: 13px; font-weight: 700; margin: 0 auto; background: var(--health); color: white; }
  .streak-badge { font-size: 13px; color: var(--muted); margin-top: 14px; }

  @media (min-width: 860px) {
    #stage:not(.force-mobile) .sidebar { display: block; width: 240px; }
    #stage:not(.force-mobile) .content { padding: 0 40px 60px; }
    #stage:not(.force-mobile) .topbar, #stage:not(.force-mobile) .greet-row { padding-left: 40px; padding-right: 40px; }
    #stage:not(.force-mobile) .header { padding: 32px 40px 8px; }
    #stage:not(.force-mobile) .pillar-tiles { flex-direction: row; }
    #stage:not(.force-mobile) .bento-grid { grid-template-columns: repeat(4, 1fr); grid-auto-rows: minmax(110px, auto); }
    #stage:not(.force-mobile) .span-2 { grid-column: span 2; }
    #stage:not(.force-mobile) .span-4 { grid-column: span 4; }
    #stage:not(.force-mobile) .row-2 { grid-row: span 2; }
    #stage:not(.force-mobile) .mindmap-wrap { height: 100%; min-height: 340px; }
  }

  #switcher { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: rgba(33,29,25,.92); color: white; border-radius: 999px; padding: 8px 6px; display: flex; align-items: center; gap: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 200; font-size: 13px; }
  #switcher button { background: rgba(255,255,255,.14); border: none; color: white; padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  #switcher button.active { background: white; color: var(--ink); }
</style>
</head>
<body>
<div id="stage"><div id="app"></div></div>
<div id="switcher">
  <button id="btn-mobile">Mobile</button>
  <button id="btn-desktop">Desktop</button>
</div>

<script>
// icons: minimal inline SVGs, stroke-only, no fill — keeps the "not mechanic" look
const ICON = {
  leaf: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20c8 0 14-6 14-15C9 5 4 11 4 20Z"/></svg>`,
  moon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>`,
  wallet: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M15 14h3"/></svg>`,
  target: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg>`,
  goal: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>`,
  trend: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 16l6-6 4 4 8-9"/></svg>`,
  layers: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3 3 8l9 5 9-5-9-5ZM3 16l9 5 9-5M3 12l9 5 9-5"/></svg>`,
};
function cardHead(icon, title) { return `<div class="card-head"><div class="card-icon">${ICON[icon]}</div><div class="card-title">${title}</div></div>`; }
function ring(pct, size, dark) {
  const r = size === "sm" ? 30 : 46, box = size === "sm" ? 76 : 112;
  const C = 2 * Math.PI * r, dash = (pct / 100) * C;
  const track = dark ? "rgba(244,239,231,.15)" : "var(--bg2)".replace("var(--bg2)", "#EAE2D3");
  return `<div class="ring-center ${size === 'sm' ? 'sm' : ''}">
    <svg width="${box}" height="${box}" class="ring-svg">
      <circle cx="${box/2}" cy="${box/2}" r="${r}" stroke="${track}" stroke-width="${size==='sm'?7:10}" fill="none" />
      <circle cx="${box/2}" cy="${box/2}" r="${r}" stroke="#D9714B" stroke-width="${size==='sm'?7:10}" fill="none" stroke-dasharray="${dash} ${C}" stroke-linecap="round" />
    </svg>
    <div class="ring-num ${size === 'sm' ? 'sm' : ''}"><span class="pct">${pct}%</span>${size!=='sm'?'<span class="lbl">to target</span>':''}</div>
  </div>`;
}

// ---------------------------------------------------------------------------
// Mock data
// ---------------------------------------------------------------------------
const HEALTH_AREAS = [
  { key: "spine", name: "Spine & Pain", angle: -60, actions: [{ name: "Stretch routine", desc: "10 minutes, spine-safe — no axial loading. Targets the lumbar-stiffness cascade before it reaches your neck.", state: "full", streak: 12 }] },
  { key: "sleep", name: "Sleep", angle: -20, actions: [{ name: "Phone out of bedroom", desc: "The single highest-leverage change for the possible OSA under investigation. Charge it in the hallway.", state: "min", streak: 3 }] },
  { key: "diet", name: "Diet", angle: 20, actions: [{ name: "Log meals", desc: "Just what you ate — no calorie targets. Protein's already a strength; this is about the pattern, not the number.", state: "full", streak: 5 }] },
  { key: "body", name: "Body Comp.", angle: 60, actions: [{ name: "Waist measurement", desc: "Weekly, same morning, same tape position. Tracking ratio, not scale weight.", state: "none", streak: 0 }] },
  { key: "bp", name: "Blood Pressure", angle: 100, actions: [] },
  { key: "looks", name: "Looks", angle: 140, actions: [] },
  { key: "healthcare", name: "Healthcare Nav.", angle: 180, actions: [] },
];
const FINANCE = {
  accessible: 18400, total: 31200,
  northStar: { label: "House deposit" },
  goals: [{ name: "Emergency fund", saved: 4200, target: 6000 }, { name: "LISA", saved: 8100, target: 20000 }],
  systems: [{ name: "Payday routine", next: "Next: 28th" }, { name: "Baseline review", next: "Monthly" }],
};

// ---------------------------------------------------------------------------
// Router
// ---------------------------------------------------------------------------
const nav = { stack: [{ screen: "welcome" }] };
function push(next) { nav.stack.push(next); render(true); }
function goSidebar(screen) { nav.stack = [{ screen: "pillars" }, { screen }]; render(true); }
function back() { if (nav.stack.length > 1) { nav.stack.pop(); render(true); } }
function current() { return nav.stack[nav.stack.length - 1]; }

function sidebar() {
  const s = current().screen;
  return `<div class="sidebar">
    <div class="brand"><span class="brand-mark">P</span> Personal</div>
    <button class="side-item ${s === 'pillars' ? 'active' : ''}" onclick="goSidebar('pillars')">Home</button>
    <button class="side-item ${s === 'healthDashboard' || s === 'area' ? 'active' : ''}" onclick="goSidebar('healthDashboard')"><span class="swatch" style="background:var(--health)"></span> Health <span class="meta">2/7 today</span></button>
    <button class="side-item ${s === 'financeDashboard' ? 'active' : ''}" onclick="goSidebar('financeDashboard')"><span class="swatch" style="background:var(--coral)"></span> Finances <span class="meta">on track</span></button>
  </div>`;
}
function header(title, crumb) {
  return `<div class="header">${nav.stack.length > 1 ? `<button class="back-btn" onclick="back()">←</button>` : `<div style="width:34px"></div>`}
    <div>${crumb ? `<div class="crumb">${crumb}</div>` : ""}${title ? `<h2 style="margin-top:2px">${title}</h2>` : ""}</div></div>`;
}
function topbar(title, subtitle) {
  return `<div class="topbar">${nav.stack.length > 1 ? `<button class="back-btn" onclick="back()">←</button>` : `<div style="width:34px"></div>`}
    <div class="titles"><h2>${title}</h2></div><div class="search-pill">Search…</div><div class="avatar">A</div></div>
    <div class="greet-row"><div class="headline">${subtitle}</div></div>`;
}
function shell(inner) { return `<div class="app-shell">${sidebar()}<div class="main">${inner}</div></div>`; }
function card(cls, icon, title, body) { return `<div class="bento-card shadow-sm ${cls}">${cardHead(icon, title)}${body}</div>`; }

// ---------------------------------------------------------------------------
// Screens
// ---------------------------------------------------------------------------
function screenWelcome() {
  return `<div class="welcome-screen">
    <div class="welcome-eyebrow">Good evening</div>
    <div class="welcome-title">Everything's steady.<br/>Take a moment first.</div>
    <div class="welcome-sub">No numbers here — just a quiet start. When you're ready, your pillars are one click away.</div>
    <button class="continue-btn" onclick="push({screen:'pillars'})">Continue</button>
  </div>`;
}
function screenPillars() {
  return shell(`${header("Your pillars", "MVP")}
    <div class="content"><div class="pillar-tiles">
      <button class="pillar-tile health shadow-sm" onclick="push({screen:'healthDashboard'})"><div class="name">Health</div><div class="hint">2 of 7 areas active today</div></button>
      <button class="pillar-tile finance shadow-sm" onclick="push({screen:'financeDashboard'})"><div class="name">Finances</div><div class="hint">On track for House deposit</div></button>
    </div></div>`);
}
function mindmapWidget() {
  const R = 100;
  const nodes = HEALTH_AREAS.map(a => { const rad = (a.angle * Math.PI)/180; return { ...a, x: 50 + (Math.cos(rad)*R)/2.6, y: 50 + (Math.sin(rad)*R)/3.6, active: a.actions.length>0 }; });
  const links = nodes.map(n => `<div class="mm-link" style="width:${R/2.6}px; left:50%; top:50%; transform: rotate(${n.angle}deg)"></div>`).join("");
  const leaves = nodes.map(n => `<button class="mm-node leaf ${n.active?'active':''}" style="left:${n.x}%; top:${n.y}%" onclick="push({screen:'area', areaKey:'${n.key}'})">${n.name}</button>`).join("");
  return `<div class="mindmap-wrap"><div class="mm-node core">Health</div>${links}${leaves}</div>`;
}
function screenHealthDashboard() {
  const today = HEALTH_AREAS.filter(a => a.actions.length).flatMap(a => a.actions.map(act => ({ ...act, area: a.name })));
  return shell(`${topbar("Health", "Two areas need you today")}
    <div class="content"><div class="bento-grid">
      ${card("span-2 row-2", "leaf", "Areas", mindmapWidget())}
      ${card("span-2", "layers", "Today", today.map(t => `<div class="list-row"><div class="left"><span class="status-dot" style="background:${t.state==='full'?'var(--health)':t.state==='min'?'var(--coral)':'var(--bg2)'}"></span><div><div class="name">${t.name}</div><div class="next">${t.area}</div></div></div><div class="dot ${t.state}"></div></div>`).join(""))}
      ${card("span-2", "trend", "Stretch routine", `<div class="bento-big-num">12</div><div class="bento-sub">day streak</div><div class="streak-grid">${[1,1,1,0,1,1,1].map(h=>`<div class="streak-cell ${h?'hit':''}"></div>`).join("")}</div>`)}
    </div></div>`);
}
function screenFinanceDashboard() {
  const { accessible, total, northStar, goals, systems } = FINANCE;
  const pct = Math.round((accessible / 45000) * 100);
  return shell(`${topbar("Finances", "On track for the house deposit")}
    <div class="content"><div class="bento-grid">
      ${card("span-2", "wallet", "Accessible net worth", `<div class="bento-big-num" style="font-size:34px">£${accessible.toLocaleString()}</div><div class="bento-sub">£${total.toLocaleString()} total, pension excluded</div><div class="pill-row"><button class="pill-btn primary">View breakdown</button></div>`)}
      ${`<div class="bento-card dark shadow-sm">${cardHead("target", northStar.label)}${ring(pct, "lg", true)}</div>`}
      ${card("span-2", "goal", "Goals", `<div class="goal-rings">${goals.map(g => `<div class="goal-ring-item">${ring(Math.round(g.saved/g.target*100), "sm", false)}<div class="name">${g.name}</div><div class="meta">£${g.saved.toLocaleString()} / £${g.target.toLocaleString()}</div></div>`).join("")}</div>`)}
      ${card("", "trend", "Trend", `<div class="spark-num"><span class="bento-big-num" style="font-size:21px">£${accessible.toLocaleString()}</span><span class="spark-badge">↑ 4.2%</span></div><svg width="100%" height="44" viewBox="0 0 160 44" preserveAspectRatio="none" style="margin-top:12px"><polyline points="0,34 20,29 40,32 60,18 80,24 100,12 120,16 140,6 160,10" fill="none" stroke="#D9714B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg>`)}
      ${card("span-4", "layers", "Systems", systems.map(s => `<div class="list-row"><div class="left"><span class="status-dot"></span><div><div class="name">${s.name}</div><div class="next">${s.next}</div></div></div></div>`).join(""))}
    </div></div>`);
}
function screenArea(s) {
  const area = HEALTH_AREAS.find(a => a.key === s.areaKey);
  return shell(`${header(area.name, "Health · Area")}<div class="content"><div class="area-list">
    ${area.actions.length ? area.actions.map(act => `<div class="action-row shadow-sm" onclick='push({screen:"action", name:${JSON.stringify(act.name)}, desc:${JSON.stringify(act.desc)}, state:"${act.state}", streak:${act.streak}})'><div><div class="name">${act.name}</div><div class="streak">${act.state==='none'?'not started':act.state+' · '+act.streak+' day streak'}</div></div><div class="dot ${act.state}"></div></div>`).join("") : `<div class="crumb">Nothing tracked in this area yet.</div>`}
  </div></div>`);
}
function screenAction(s) {
  return shell(`${header(null, "Action")}<div class="content"><div class="action-hero shadow-sm">
    <div class="name">${s.name}</div><div class="desc">${s.desc}</div>
    <button class="checkin-btn" id="checkin-btn">${s.state==='none'?'Check in':s.state==='full'?'Full ✓':'Minimum'}</button>
    <div class="streak-badge">${s.streak} day streak</div>
  </div></div>`);
}

function render(animate) {
  const app = document.getElementById("app");
  const doRender = () => {
    const s = current();
    const map = { welcome: screenWelcome, pillars: screenPillars, healthDashboard: screenHealthDashboard, financeDashboard: screenFinanceDashboard, area: screenArea, action: screenAction };
    app.innerHTML = map[s.screen](s);
    window.scrollTo(0, 0);
    app.classList.remove("fading");
    const btn = document.getElementById("checkin-btn");
    if (btn) btn.addEventListener("click", () => { const order=["none","min","full"]; current().state = order[(order.indexOf(current().state)+1)%order.length]; render(false); });
  };
  if (animate) { app.classList.add("fading"); setTimeout(doRender, 120); } else { doRender(); }
}
function setPreview(mode) {
  document.getElementById("stage").classList.toggle("force-mobile", mode === "mobile");
  document.getElementById("btn-mobile").classList.toggle("active", mode === "mobile");
  document.getElementById("btn-desktop").classList.toggle("active", mode === "desktop");
}
document.getElementById("btn-mobile").addEventListener("click", () => setPreview("mobile"));
document.getElementById("btn-desktop").addEventListener("click", () => setPreview("desktop"));
document.addEventListener("keydown", (e) => { if (e.key === "Backspace" || e.key === "Escape") back(); });
setPreview(window.innerWidth < 860 ? "mobile" : "desktop");
render(false);
</script>
</body>
</html>
