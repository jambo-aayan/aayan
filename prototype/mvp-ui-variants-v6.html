<!--
  PROTOTYPE v6 — throwaway. Answers wayfinder ticket #3.

  Feedback on v5: right general direction, but cards were sized for
  mobile and just stretched into a centered, capped-width column on
  desktop — wasting the rest of the viewport, and reading as "amateurish"
  rather than a real desktop app. A second reference image (a denser
  SaaS finance dashboard) reinforced the ask: denser cards, more actual
  content (a real trend chart, a data table, more stat cards, colour
  variety), using the full width.

  v6, Finance Dashboard only (this is what both references targeted):
    - content area is fluid, not capped at ~980px
    - a 6-column grid at wide widths (was 4), so span-2 cards are ~1/3
      width instead of half — smaller, denser cards
    - a top stat row (4 compact cards, each a distinct accent colour)
    - a bigger trend chart + a "Systems" side panel, side by side
    - a real "Recent activity" table, not just a couple of list rows
    - a 3-segment net worth breakdown ring, echoing the reference's arc chart
  Health dashboard gets the same width/density fix but no new features
  yet — scoped to what the feedback was actually about.

  Read-only. Mock data only. Not for production.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PROTOTYPE v6 — dense desktop finance dashboard</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    --bg: #F3EEE5;
    --bg2: #EAE2D3;
    --card: #FFFFFF;
    --ink: #211D19;
    --muted: #928B7E;
    --coral: #D9714B;
    --coral-soft: #F6E1D5;
    --health: #6E8B74;
    --health-soft: #E7EEE6;
    --amber: #C79A3D;
    --amber-soft: #F3E9D2;
    --slate: #6C7A8C;
    --slate-soft: #E3E7EC;
    --black-card: #1E1B17;
    background: var(--bg);
    color: var(--ink);
  }
  button { font-family: inherit; cursor: pointer; }
  h1, h2, h3, p { margin: 0; }
  .shadow-sm { box-shadow: 0 1px 2px rgba(33,29,25,.04), 0 8px 22px rgba(33,29,25,.05); }

  #stage { min-height: 100vh; position: relative; }
  #stage.force-mobile { max-width: 430px; margin: 0 auto; }
  #app { position: relative; transition: opacity .18s ease; }
  #app.fading { opacity: 0; }

  .back-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--card); color: var(--ink); box-shadow: 0 2px 8px rgba(33,29,25,.08); display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
  .crumb { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .dot { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; }
  .dot.full { background: var(--health); }
  .dot.min { background: var(--coral); opacity: .55; }
  .dot.none { background: var(--bg2); }

  /* ============ Welcome ============ */
  .welcome-screen { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; position: relative; overflow: hidden; }
  .welcome-screen::before { content: ""; position: absolute; inset: -20%; background: radial-gradient(circle at 25% 20%, rgba(110,139,116,.14), transparent 55%), radial-gradient(circle at 80% 75%, rgba(217,113,75,.12), transparent 55%); filter: blur(10px); }
  .welcome-eyebrow, .welcome-title, .welcome-sub, .continue-btn { position: relative; }
  .welcome-eyebrow { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
  .welcome-title { font-size: 32px; line-height: 1.22; margin-bottom: 14px; font-weight: 600; }
  .welcome-sub { font-size: 15px; line-height: 1.55; color: var(--muted); max-width: 340px; margin-bottom: 40px; }
  .continue-btn { padding: 15px 36px; border-radius: 999px; border: none; font-size: 15px; font-weight: 600; background: var(--ink); color: var(--bg); }

  /* ============ shell ============ */
  .app-shell { display: flex; min-height: 100vh; }
  .sidebar { width: 100%; flex-shrink: 0; padding: 22px 16px; display: none; }
  .sidebar .brand { font-size: 15px; font-weight: 700; padding: 4px 10px 22px; display: flex; align-items: center; gap: 8px; }
  .brand-mark { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .side-item { display: flex; align-items: center; gap: 10px; padding: 11px 13px; border-radius: 13px; border: none; background: none; width: 100%; text-align: left; margin-bottom: 3px; color: var(--muted); font-size: 13.5px; font-weight: 500; }
  .side-item .swatch { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .side-item.active { background: var(--card); color: var(--ink); font-weight: 700; }
  .side-item .meta { margin-left: auto; font-size: 11px; color: var(--muted); }
  .main { flex: 1; min-width: 0; }
  .content { padding: 6px 20px 40px; }

  .header { display: flex; align-items: center; gap: 12px; padding: 18px 20px 6px; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 20px 20px 4px; flex-wrap: wrap; }
  .topbar .titles h2 { font-size: 18px; font-weight: 700; }
  .search-pill { flex: 1; min-width: 120px; max-width: 280px; background: var(--card); border-radius: 999px; padding: 8px 15px; font-size: 12.5px; color: var(--muted); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .greet-row { padding: 6px 20px 16px; }
  .greet-row .headline { font-size: 21px; font-weight: 600; letter-spacing: -.01em; }

  /* ============ generic card ============ */
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .card-icon { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .card-icon svg { width: 14px; height: 14px; }
  .card-title { font-size: 13px; font-weight: 500; color: var(--muted); }

  /* ============ dashboard grid ============ */
  .dash-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .bento-card { background: var(--card); border-radius: 20px; padding: 18px; }
  .bento-card.dark { background: var(--black-card); color: #F4EFE7; }
  .bento-card.dark .card-title { color: rgba(244,239,231,.6); }
  .bento-big-num { font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
  .bento-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .bento-card.dark .bento-sub { color: rgba(244,239,231,.5); }

  /* stat row */
  .stat-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px; }
  .stat-card { background: var(--card); border-radius: 18px; padding: 16px 18px; }
  .stat-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .stat-swatch { width: 8px; height: 8px; border-radius: 50%; }
  .stat-label { font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .stat-num { font-size: 22px; font-weight: 700; }
  .stat-chip { display: inline-block; margin-left: 6px; font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; vertical-align: middle; }
  .stat-sub { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

  .pill-row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .pill-btn { border: none; border-radius: 999px; padding: 10px 18px; font-size: 12.5px; font-weight: 600; }
  .pill-btn.primary { background: var(--ink); color: var(--bg); }

  /* rings */
  .ring-center { position: relative; width: 92px; height: 92px; margin: 0 auto; }
  .ring-center.sm { width: 64px; height: 64px; }
  .ring-svg { display: block; transform: rotate(-90deg); }
  .ring-num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-num .pct { font-size: 19px; font-weight: 700; }
  .ring-num.sm .pct { font-size: 14px; }
  .ring-num .lbl { font-size: 9px; color: rgba(244,239,231,.55); margin-top: 2px; }
  .ring-num.sm .lbl { color: var(--muted); }

  .goal-rings { display: flex; gap: 18px; justify-content: space-around; margin-top: 2px; }
  .goal-ring-item { text-align: center; }
  .goal-ring-item .name { font-size: 12px; font-weight: 600; margin-top: 8px; }
  .goal-ring-item .meta { font-size: 10.5px; color: var(--muted); margin-top: 1px; }

  /* trend chart */
  .trend-legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--muted); margin-bottom: 6px; }
  .trend-legend .lg-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; }

  /* clean divided list */
  .list-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid rgba(33,29,25,.06); }
  .list-row:first-of-type { border-top: none; padding-top: 2px; }
  .list-row .left { display: flex; align-items: center; gap: 10px; }
  .list-row .name { font-size: 13px; font-weight: 500; }
  .list-row .next { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--health); flex-shrink: 0; }

  /* activity table */
  .activity-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .activity-table th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .03em; padding: 0 8px 10px; }
  .activity-table td { padding: 10px 8px; border-top: 1px solid rgba(33,29,25,.06); }
  .activity-table tr:first-of-type td { border-top: none; }
  .pillar-tag { font-size: 10.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
  .amt-pos { color: var(--health); font-weight: 600; }
  .amt-neutral { color: var(--muted); }

  .streak-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 12px; }
  .streak-cell { aspect-ratio: 1; border-radius: 6px; background: var(--bg2); }
  .streak-cell.hit { background: var(--health); }

  /* mindmap */
  .mindmap-wrap { position: relative; height: 240px; }
  .mm-node { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 10.5px; font-weight: 600; border: none; transform: translate(-50%, -50%); }
  .mm-node.core { width: 56px; height: 56px; left: 50%; top: 50%; font-size: 11px; z-index: 2; background: var(--ink); color: var(--bg); }
  .mm-node.leaf { width: 50px; height: 50px; z-index: 1; background: var(--bg2); color: var(--ink); }
  .mm-node.leaf.active { background: var(--health); color: white; }
  .mm-link { position: absolute; height: 1.5px; transform-origin: left center; z-index: 0; background: rgba(33,29,25,.08); }

  .pillar-tiles { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
  .pillar-tile { border: none; text-align: left; padding: 22px; border-radius: 22px; display: flex; flex-direction: column; gap: 5px; width: 100%; background: var(--card); }
  .pillar-tile.health .name { color: var(--health); }
  .pillar-tile.finance .name { color: var(--coral); }
  .pillar-tile .name { font-size: 17px; font-weight: 700; }
  .pillar-tile .hint { font-size: 12.5px; color: var(--muted); }

  .area-list { display: flex; flex-direction: column; gap: 9px; }
  .action-row { display: flex; align-items: center; justify-content: space-between; padding: 15px 18px; border-radius: 18px; background: var(--card); }
  .action-row .name { font-size: 14px; font-weight: 600; }
  .action-row .streak { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

  .action-hero { padding: 28px 26px; border-radius: 24px; background: var(--health-soft); text-align: center; }
  .action-hero .name { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .action-hero .desc { font-size: 13.5px; color: var(--muted); line-height: 1.55; margin-bottom: 22px; }
  .checkin-btn { width: 78px; height: 78px; border-radius: 50%; border: none; font-size: 12.5px; font-weight: 700; margin: 0 auto; background: var(--health); color: white; }
  .streak-badge { font-size: 12.5px; color: var(--muted); margin-top: 12px; }

  @media (min-width: 860px) {
    #stage:not(.force-mobile) .sidebar { display: block; width: 220px; }
    #stage:not(.force-mobile) .content { padding: 0 28px 48px; }
    #stage:not(.force-mobile) .topbar, #stage:not(.force-mobile) .greet-row { padding-left: 28px; padding-right: 28px; }
    #stage:not(.force-mobile) .header { padding: 24px 28px 6px; }
    #stage:not(.force-mobile) .pillar-tiles { flex-direction: row; }
    #stage:not(.force-mobile) .stat-row { grid-template-columns: repeat(4, 1fr); }
    #stage:not(.force-mobile) .dash-grid { grid-template-columns: repeat(6, 1fr); grid-auto-rows: minmax(70px, auto); }
    #stage:not(.force-mobile) .span-2 { grid-column: span 2; }
    #stage:not(.force-mobile) .span-3 { grid-column: span 3; }
    #stage:not(.force-mobile) .span-4 { grid-column: span 4; }
    #stage:not(.force-mobile) .span-6 { grid-column: span 6; }
    #stage:not(.force-mobile) .row-2 { grid-row: span 2; }
    #stage:not(.force-mobile) .mindmap-wrap { height: 100%; min-height: 300px; }
  }
  @media (min-width: 1240px) {
    #stage:not(.force-mobile) .content { padding: 0 40px 56px; }
    #stage:not(.force-mobile) .topbar, #stage:not(.force-mobile) .greet-row { padding-left: 40px; padding-right: 40px; }
  }

  #switcher { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: rgba(33,29,25,.92); color: white; border-radius: 999px; padding: 8px 6px; display: flex; align-items: center; gap: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 200; font-size: 13px; }
  #switcher button { background: rgba(255,255,255,.14); border: none; color: white; padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  #switcher button.active { background: white; color: var(--ink); }
</style>
</head>
<body>
<div id="stage"><div id="app"></div></div>
<div id="switcher">
  <button id="btn-mobile">Mobile</button>
  <button id="btn-desktop">Desktop</button>
</div>

<script>
const ICON = {
  leaf: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20c8 0 14-6 14-15C9 5 4 11 4 20Z"/></svg>`,
  wallet: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M15 14h3"/></svg>`,
  target: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg>`,
  goal: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>`,
  trend: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 16l6-6 4 4 8-9"/></svg>`,
  layers: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3 3 8l9 5 9-5-9-5ZM3 16l9 5 9-5M3 12l9 5 9-5"/></svg>`,
  coins: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>`,
  pie: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v9l7.5 4.3A9 9 0 1 1 12 3Z"/></svg>`,
  clock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
};
function cardHead(icon, title, tint) { return `<div class="card-head"><div class="card-icon" style="background:${tint}">${ICON[icon]}</div><div class="card-title">${title}</div></div>`; }
function ring(pct, size, dark, color) {
  color = color || "#D9714B";
  const r = size === "sm" ? 26 : 38, box = size === "sm" ? 64 : 92;
  const C = 2 * Math.PI * r, dash = (pct / 100) * C;
  const track = dark ? "rgba(244,239,231,.15)" : "#EAE2D3";
  return `<div class="ring-center ${size === 'sm' ? 'sm' : ''}">
    <svg width="${box}" height="${box}" class="ring-svg">
      <circle cx="${box/2}" cy="${box/2}" r="${r}" stroke="${track}" stroke-width="${size==='sm'?6:9}" fill="none" />
      <circle cx="${box/2}" cy="${box/2}" r="${r}" stroke="${color}" stroke-width="${size==='sm'?6:9}" fill="none" stroke-dasharray="${dash} ${C}" stroke-linecap="round" />
    </svg>
    <div class="ring-num ${size === 'sm' ? 'sm' : ''}"><span class="pct">${pct}%</span>${size!=='sm'?'<span class="lbl">to target</span>':''}</div>
  </div>`;
}
// 3-segment breakdown ring
function breakdownRing(segments, centerLabel, centerSub) {
  const total = segments.reduce((s, x) => s + x.value, 0);
  const r = 42, C = 2 * Math.PI * r, box = 100;
  let offset = 0;
  const arcs = segments.map(seg => {
    const len = (seg.value / total) * C;
    const el = `<circle cx="${box/2}" cy="${box/2}" r="${r}" stroke="${seg.color}" stroke-width="11" fill="none" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-offset}" stroke-linecap="round" />`;
    offset += len + 3;
    return el;
  }).join("");
  return `<div class="ring-center" style="width:${box}px;height:${box}px">
    <svg width="${box}" height="${box}" class="ring-svg">${arcs}</svg>
    <div class="ring-num"><span class="pct" style="font-size:15px">${centerLabel}</span><span class="lbl" style="color:var(--muted)">${centerSub}</span></div>
  </div>`;
}

// ---------------------------------------------------------------------------
// Mock data
// ---------------------------------------------------------------------------
const HEALTH_AREAS = [
  { key: "spine", name: "Spine & Pain", angle: -60, actions: [{ name: "Stretch routine", desc: "10 minutes, spine-safe — no axial loading.", state: "full", streak: 12 }] },
  { key: "sleep", name: "Sleep", angle: -20, actions: [{ name: "Phone out of bedroom", desc: "The single highest-leverage change for the possible OSA under investigation.", state: "min", streak: 3 }] },
  { key: "diet", name: "Diet", angle: 20, actions: [{ name: "Log meals", desc: "Just what you ate — no calorie targets.", state: "full", streak: 5 }] },
  { key: "body", name: "Body Comp.", angle: 60, actions: [{ name: "Waist measurement", desc: "Weekly, same morning, same tape position.", state: "none", streak: 0 }] },
  { key: "bp", name: "Blood Pressure", angle: 100, actions: [] },
  { key: "looks", name: "Looks", angle: 140, actions: [] },
  { key: "healthcare", name: "Healthcare Nav.", angle: 180, actions: [] },
];
const FINANCE = {
  accessible: 18400, total: 31200, surplus: 850,
  goals: [{ name: "Emergency fund", saved: 4200, target: 6000 }, { name: "LISA", saved: 8100, target: 20000 }],
  systems: [{ name: "Payday routine", next: "Next: 28th" }, { name: "Baseline review", next: "Monthly" }, { name: "LISA top-up", next: "Next: 1st" }],
  breakdown: [
    { name: "Cash", value: 8400, color: "#D9714B" },
    { name: "LISA", value: 8100, color: "#C79A3D" },
    { name: "Other liquid", value: 1900, color: "#6C7A8C" },
  ],
  activity: [
    { item: "LISA contribution", date: "15 Jul", pillar: "Finances", amount: "+£300", pos: true },
    { item: "Payday routine ran", date: "28 Jun", pillar: "Finances", amount: "+£850", pos: true },
    { item: "Emergency fund top-up", date: "20 Jun", pillar: "Finances", amount: "+£150", pos: true },
    { item: "Dental quote reviewed", date: "12 Jun", pillar: "Finances", amount: "—", pos: false },
    { item: "Baseline review", date: "1 Jun", pillar: "Finances", amount: "no change", pos: false },
  ],
};

// ---------------------------------------------------------------------------
// Router
// ---------------------------------------------------------------------------
const nav = { stack: [{ screen: "welcome" }] };
function push(next) { nav.stack.push(next); render(true); }
function goSidebar(screen) { nav.stack = [{ screen: "pillars" }, { screen }]; render(true); }
function back() { if (nav.stack.length > 1) { nav.stack.pop(); render(true); } }
function current() { return nav.stack[nav.stack.length - 1]; }

function sidebar() {
  const s = current().screen;
  return `<div class="sidebar">
    <div class="brand"><span class="brand-mark">P</span> Personal</div>
    <button class="side-item ${s === 'pillars' ? 'active' : ''}" onclick="goSidebar('pillars')">Home</button>
    <button class="side-item ${s === 'healthDashboard' || s === 'area' ? 'active' : ''}" onclick="goSidebar('healthDashboard')"><span class="swatch" style="background:var(--health)"></span> Health <span class="meta">2/7 today</span></button>
    <button class="side-item ${s === 'financeDashboard' ? 'active' : ''}" onclick="goSidebar('financeDashboard')"><span class="swatch" style="background:var(--coral)"></span> Finances <span class="meta">on track</span></button>
  </div>`;
}
function header(title, crumb) {
  return `<div class="header">${nav.stack.length > 1 ? `<button class="back-btn" onclick="back()">←</button>` : `<div style="width:32px"></div>`}
    <div>${crumb ? `<div class="crumb">${crumb}</div>` : ""}${title ? `<h2 style="margin-top:2px">${title}</h2>` : ""}</div></div>`;
}
function topbar(title, subtitle) {
  return `<div class="topbar">${nav.stack.length > 1 ? `<button class="back-btn" onclick="back()">←</button>` : `<div style="width:32px"></div>`}
    <div class="titles"><h2>${title}</h2></div><div class="search-pill">Search…</div><div class="avatar">A</div></div>
    <div class="greet-row"><div class="headline">${subtitle}</div></div>`;
}
function shell(inner) { return `<div class="app-shell">${sidebar()}<div class="main">${inner}</div></div>`; }
function card(cls, icon, title, tint, body) { return `<div class="bento-card shadow-sm ${cls}">${cardHead(icon, title, tint)}${body}</div>`; }
function statCard(color, label, num, chip, sub) {
  return `<div class="stat-card shadow-sm">
    <div class="stat-top"><span class="stat-swatch" style="background:${color}"></span><span class="stat-label">${label}</span></div>
    <div><span class="stat-num">${num}</span>${chip ? `<span class="stat-chip" style="background:${color}22;color:${color}">${chip}</span>` : ""}</div>
    <div class="stat-sub">${sub}</div>
  </div>`;
}

// ---------------------------------------------------------------------------
// Screens
// ---------------------------------------------------------------------------
function screenWelcome() {
  return `<div class="welcome-screen">
    <div class="welcome-eyebrow">Good evening</div>
    <div class="welcome-title">Everything's steady.<br/>Take a moment first.</div>
    <div class="welcome-sub">No numbers here — just a quiet start. When you're ready, your pillars are one click away.</div>
    <button class="continue-btn" onclick="push({screen:'pillars'})">Continue</button>
  </div>`;
}
function screenPillars() {
  return shell(`${header("Your pillars", "MVP")}
    <div class="content"><div class="pillar-tiles">
      <button class="pillar-tile health shadow-sm" onclick="push({screen:'healthDashboard'})"><div class="name">Health</div><div class="hint">2 of 7 areas active today</div></button>
      <button class="pillar-tile finance shadow-sm" onclick="push({screen:'financeDashboard'})"><div class="name">Finances</div><div class="hint">On track for House deposit</div></button>
    </div></div>`);
}
function mindmapWidget() {
  const R = 100;
  const nodes = HEALTH_AREAS.map(a => { const rad = (a.angle * Math.PI)/180; return { ...a, x: 50 + (Math.cos(rad)*R)/2.6, y: 50 + (Math.sin(rad)*R)/3.6, active: a.actions.length>0 }; });
  const links = nodes.map(n => `<div class="mm-link" style="width:${R/2.6}px; left:50%; top:50%; transform: rotate(${n.angle}deg)"></div>`).join("");
  const leaves = nodes.map(n => `<button class="mm-node leaf ${n.active?'active':''}" style="left:${n.x}%; top:${n.y}%" onclick="push({screen:'area', areaKey:'${n.key}'})">${n.name}</button>`).join("");
  return `<div class="mindmap-wrap"><div class="mm-node core">Health</div>${links}${leaves}</div>`;
}
function screenHealthDashboard() {
  const today = HEALTH_AREAS.filter(a => a.actions.length).flatMap(a => a.actions.map(act => ({ ...act, area: a.name })));
  return shell(`${topbar("Health", "Two areas need you today")}
    <div class="content"><div class="dash-grid">
      ${card("span-3 row-2", "leaf", "Areas", "var(--health-soft)", mindmapWidget())}
      ${card("span-3", "layers", "Today", "var(--bg2)", today.map(t => `<div class="list-row"><div class="left"><span class="status-dot" style="background:${t.state==='full'?'var(--health)':t.state==='min'?'var(--coral)':'var(--bg2)'}"></span><div><div class="name">${t.name}</div><div class="next">${t.area}</div></div></div><div class="dot ${t.state}"></div></div>`).join(""))}
      ${card("span-3", "trend", "Stretch routine", "var(--bg2)", `<div class="bento-big-num">12</div><div class="bento-sub">day streak</div><div class="streak-grid">${[1,1,1,0,1,1,1].map(h=>`<div class="streak-cell ${h?'hit':''}"></div>`).join("")}</div>`)}
    </div></div>`);
}
function screenFinanceDashboard() {
  const { accessible, total, surplus, goals, systems, breakdown, activity } = FINANCE;
  const pct = Math.round((accessible / 45000) * 100);
  return shell(`${topbar("Finances", "On track for the house deposit")}
    <div class="content">
      <div class="stat-row">
        ${statCard("#D9714B", "Accessible net worth", "£" + accessible.toLocaleString(), "↑ 4.2%", "since last month")}
        ${statCard("#6C7A8C", "Total net worth", "£" + total.toLocaleString(), null, "pension excluded")}
        ${statCard("#6E8B74", "Monthly surplus", "£" + surplus, "↑ 12%", "income − outgoings")}
        ${statCard("#C79A3D", "House deposit", pct + "%", "on track", "of £45,000 target")}
      </div>
      <div class="dash-grid">
        ${card("span-4", "trend", "Net worth trend", "var(--bg2)", `<div class="trend-legend"><span><span class="lg-dot" style="background:#D9714B"></span>Accessible</span><span><span class="lg-dot" style="background:#C79A3D"></span>LISA</span></div><svg width="100%" height="120" viewBox="0 0 400 120" preserveAspectRatio="none"><polyline points="0,90 50,80 100,85 150,55 200,65 250,35 300,42 350,18 400,26" fill="none" stroke="#D9714B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><polyline points="0,105 50,100 100,95 150,90 200,80 250,72 300,60 350,52 400,44" fill="none" stroke="#C79A3D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".8" /></svg>`)}
        ${`<div class="bento-card dark shadow-sm span-2 row-2" style="display:flex;flex-direction:column;align-items:center;justify-content:center">${cardHead("target", "House deposit", "rgba(244,239,231,.1)")}${ring(pct, "lg", true, "#D9714B")}</div>`}
        ${card("span-2", "goal", "Goals", "var(--coral-soft)", `<div class="goal-rings">${goals.map(g => `<div class="goal-ring-item">${ring(Math.round(g.saved/g.target*100), "sm", false, "#D9714B")}<div class="name">${g.name}</div><div class="meta">£${g.saved.toLocaleString()} / £${g.target.toLocaleString()}</div></div>`).join("")}</div>`)}
        ${card("span-2", "layers", "Systems", "var(--bg2)", systems.map(s => `<div class="list-row"><div class="left"><span class="status-dot"></span><div><div class="name">${s.name}</div><div class="next">${s.next}</div></div></div></div>`).join(""))}
        ${card("span-2", "pie", "Breakdown", "var(--slate-soft)", `<div style="display:flex;align-items:center;gap:16px">${breakdownRing(breakdown, "£" + Math.round(FINANCE.accessible/1000) + "k", "accessible")}<div style="flex:1">${breakdown.map(b => `<div style="display:flex;align-items:center;gap:7px;font-size:11.5px;margin-bottom:6px"><span style="width:7px;height:7px;border-radius:50%;background:${b.color};flex-shrink:0"></span>${b.name}<span style="margin-left:auto;color:var(--muted)">£${b.value.toLocaleString()}</span></div>`).join("")}</div></div>`)}
        ${card("span-6", "clock", "Recent activity", "var(--bg2)", `<table class="activity-table"><thead><tr><th>Item</th><th>Date</th><th>Pillar</th><th>Amount</th></tr></thead><tbody>${activity.map(a => `<tr><td>${a.item}</td><td>${a.date}</td><td><span class="pillar-tag" style="background:var(--coral-soft);color:var(--coral)">${a.pillar}</span></td><td class="${a.pos ? 'amt-pos' : 'amt-neutral'}">${a.amount}</td></tr>`).join("")}</tbody></table>`)}
      </div>
    </div>`);
}
function screenArea(s) {
  const area = HEALTH_AREAS.find(a => a.key === s.areaKey);
  return shell(`${header(area.name, "Health · Area")}<div class="content"><div class="area-list">
    ${area.actions.length ? area.actions.map(act => `<div class="action-row shadow-sm" onclick='push({screen:"action", name:${JSON.stringify(act.name)}, desc:${JSON.stringify(act.desc)}, state:"${act.state}", streak:${act.streak}})'><div><div class="name">${act.name}</div><div class="streak">${act.state==='none'?'not started':act.state+' · '+act.streak+' day streak'}</div></div><div class="dot ${act.state}"></div></div>`).join("") : `<div class="crumb">Nothing tracked in this area yet.</div>`}
  </div></div>`);
}
function screenAction(s) {
  return shell(`${header(null, "Action")}<div class="content"><div class="action-hero shadow-sm">
    <div class="name">${s.name}</div><div class="desc">${s.desc}</div>
    <button class="checkin-btn" id="checkin-btn">${s.state==='none'?'Check in':s.state==='full'?'Full ✓':'Minimum'}</button>
    <div class="streak-badge">${s.streak} day streak</div>
  </div></div>`);
}

function render(animate) {
  const app = document.getElementById("app");
  const doRender = () => {
    const s = current();
    const map = { welcome: screenWelcome, pillars: screenPillars, healthDashboard: screenHealthDashboard, financeDashboard: screenFinanceDashboard, area: screenArea, action: screenAction };
    app.innerHTML = map[s.screen](s);
    window.scrollTo(0, 0);
    app.classList.remove("fading");
    const btn = document.getElementById("checkin-btn");
    if (btn) btn.addEventListener("click", () => { const order=["none","min","full"]; current().state = order[(order.indexOf(current().state)+1)%order.length]; render(false); });
  };
  if (animate) { app.classList.add("fading"); setTimeout(doRender, 120); } else { doRender(); }
}
function setPreview(mode) {
  document.getElementById("stage").classList.toggle("force-mobile", mode === "mobile");
  document.getElementById("btn-mobile").classList.toggle("active", mode === "mobile");
  document.getElementById("btn-desktop").classList.toggle("active", mode === "desktop");
}
document.getElementById("btn-mobile").addEventListener("click", () => setPreview("mobile"));
document.getElementById("btn-desktop").addEventListener("click", () => setPreview("desktop"));
document.addEventListener("keydown", (e) => { if (e.key === "Backspace" || e.key === "Escape") back(); });
setPreview(window.innerWidth < 860 ? "mobile" : "desktop");
render(false);
</script>
</body>
</html>
